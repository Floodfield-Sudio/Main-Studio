
<!DOCTYPE html>

<html lang="en">
        <head>
                <meta charset="utf-8"/>
                <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
                <title>Floodfield Studio - Home</title>
                <link rel="icon" type="image/png" sizes="32x32" href="https://floodfield-sudio.github.io/FFS.index/assets/img/floodfiled_studio-sans_fond.png">
                <script src="https://cdn.tailwindcss.com"></script>
                <style>
                        :root {
                            --bg-color: #0d1117;
                            --card-bg: #161b22;
                            --text-primary: #c9d1d9;
                            --text-secondary: #8b949e;
                            --accent: #58a6ff;
                            --border: #30363d;
                        }
                
                        body {
                            background-color: var(--bg-color);
                            color: var(--text-primary);
                            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                            line-height: 1.6;
                        }
                
                        .glass-card {
                            background: var(--card-bg);
                            border: 1px solid var(--border);
                            border-radius: 12px;
                            margin-bottom: 24px;
                        }
                
                        a {
                            color: var(--accent);
                            text-decoration: none;
                            transition: color 0.2s;
                        }
                
                        a:hover {
                            text-decoration: underline;
                            color: #79c0ff;
                        }
                
                        code {
                            background-color: rgba(110, 118, 129, 0.4);
                            padding: 0.2em 0.4em;
                            border-radius: 6px;
                            font-size: 85%;
                            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
                        }
                
                        pre {
                            background-color: #0d1117 !important;
                            border: 1px solid var(--border);
                            padding: 16px;
                            padding-top: 36px; /* Espace pour le bouton copier */
                            border-radius: 8px;
                            overflow-x: auto;
                            margin: 16px 0;
                            position: relative; /* Nécessaire pour le bouton */
                        }
                
                        pre code {
                            background-color: transparent;
                            padding: 0;
                            font-size: 14px;
                        }
                
                        /* Styles pour le bouton de copie */
                        .copy-button {
                            position: absolute;
                            top: 8px;
                            right: 8px;
                            background-color: var(--card-bg);
                            border: 1px solid var(--border);
                            color: var(--text-secondary);
                            border-radius: 6px;
                            padding: 4px 8px;
                            font-size: 12px;
                            cursor: pointer;
                            display: flex;
                            align-items: center;
                            transition: all 0.2s ease;
                        }
                
                        .copy-button:hover {
                            background-color: var(--border);
                            color: var(--text-primary);
                        }
                    
                        .lang-btn {
                            border: 1px solid var(--border);
                            background: var(--card-bg);
                            color: var(--text-primary);
                            border-radius: 9999px;
                            padding: 0.45rem 0.8rem;
                            font-size: 0.875rem;
                            transition: all 0.2s ease;
                            cursor: pointer;
                        }
                        .lang-btn.active {
                            border-color: var(--accent);
                            color: white;
                            box-shadow: 0 0 0 1px rgba(88,166,255,0.18) inset;
                        }
                
                    </style>

                            © 2022 Floodfield Studios.
                        </p>

                 Script pour le bouton Copy 
                <script>
                        document.addEventListener('DOMContentLoaded', () => {
                            document.querySelectorAll('pre').forEach(pre => {
                                const codeElement = pre.querySelector('code');
                                if (!codeElement) return;
                
                                const button = document.createElement('button');
                                button.className = 'copy-button';
                                button.innerHTML = `
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                    </svg> Copier`;
                                
                                button.addEventListener('click', () => {
                                    const textToCopy = codeElement.innerText;
                                    
                                    // Méthode compatible pour copier (marche même dans les iframes sur certains navigateurs)
                                    const textArea = document.createElement("textarea");
                                    textArea.value = textToCopy;
                                    textArea.style.position = "absolute";
                                    textArea.style.left = "-999999px";
                                    document.body.appendChild(textArea);
                                    textArea.select();
                                    
                                    try {
                                        document.execCommand('copy');
                                        
                                        // Changement d'état visuel au succès
                                        button.innerHTML = `
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                            </svg> <span class="text-green-400">Copié !</span>`;
                                        button.style.borderColor = '#3fb950';
                                        
                                        setTimeout(() => {
                                            button.innerHTML = `
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                                </svg> Copier`;
                                            button.style.borderColor = '';
                                        }, 2000);
                                    } catch (err) {
                                        console.error('Erreur lors de la copie', err);
                                    }
                                    
                                    document.body.removeChild(textArea);
                                });
                                
                                pre.appendChild(button);
                            });
                        });
                </script>

                        const titleMap = {"en": "DevStudio Pro - IDE & Builder", "fr": "DevStudio Pro - IDE & Builder"};
                        const storageKey = 'siteLang';
                        let currentLang = 'en';
                
                        function translateText(text, fromLang, toLang) {
                          const sourcePairs = fromLang === 'fr' ? pairs : pairs.map(([fr, en]) => [en, fr]);
                          let out = text;
                          sourcePairs.forEach(([from, to]) => {
                            if (from && to && out.includes(from)) {
                              out = out.split(from).join(to);
                            }
                          });
                          return out;
                        }
                
                        function walkTextNodes(root, fromLang, toLang) {
                          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                            acceptNode(node) {
                              const parent = node.parentElement;
                              if (!parent) return NodeFilter.FILTER_REJECT;
                              if (['SCRIPT', 'STYLE', 'NOSCRIPT'].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
                              return NodeFilter.FILTER_ACCEPT;
                            }
                          });
                          const nodes = [];
                          while (walker.nextNode()) nodes.push(walker.currentNode);
                          nodes.forEach(node => {
                            node.nodeValue = translateText(node.nodeValue, fromLang, toLang);
                          });
                        }
                
                        function setButtons(lang) {
                          const btnFr = document.getElementById('btn-fr');
                          const btnEn = document.getElementById('btn-en');
                          if (btnFr) btnFr.classList.toggle('active', lang === 'fr');
                          if (btnEn) btnEn.classList.toggle('active', lang === 'en');
                        }
                
                        function applyLanguage(lang) {
                          if (lang !== currentLang) {
                            walkTextNodes(document.body, currentLang, lang);
                            currentLang = lang;
                          }
                          document.documentElement.lang = lang;
                          if (titleMap[lang]) document.title = titleMap[lang];
                          localStorage.setItem(storageKey, lang);
                          setButtons(lang);
                        }
                
                        const saved = localStorage.getItem(storageKey);
                        const defaultLang = 'en';
                        applyLanguage(saved || defaultLang);
                
                        const btnFr = document.getElementById('btn-fr');
                        const btnEn = document.getElementById('btn-en');
                        if (btnFr) btnFr.addEventListener('click', () => applyLanguage('fr'));
                        if (btnEn) btnEn.addEventListener('click', () => applyLanguage('en'));
                      });
                </script>
